name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10
          cache: true

      - name: Cache ~/.elm
        uses: actions/cache@v5
        with:
          path: ~/.elm
          key: elm-${{ hashFiles('elm.json', 'review/elm.json') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run bench tests
        run: pnpm test:bench

      - name: Check formatting
        run: pnpm format:check

      - name: Run elm-review
        run: pnpm review

      - name: Build benchmarks
        run: pnpm bench:build
